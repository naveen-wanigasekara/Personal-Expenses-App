<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive UI review</title><style>body{margin:0;background:#26333c;color:white;font:14px system-ui}header{height:50px;display:flex;align-items:center;gap:16px;padding:0 20px}select{padding:8px}iframe{display:block;border:0;margin:0 auto;background:#080f14}main{overflow:auto;padding:12px}</style></head><body><header><label for="size">Review viewport</label><select id="size"><option value="390,844">Mobile 390 × 844</option><option value="320,740">Small mobile 320 × 740</option><option value="430,932">Large mobile 430 × 932</option><option value="768,1024">Tablet 768 × 1024</option><option value="1280,800">Desktop 1280 × 800</option></select><span>Temporary branch-only responsive review</span></header><main><iframe title="Finance app review" src="/" width="390" height="844"></iframe></main><script>document.querySelector('select').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h;});</script></body></html>
